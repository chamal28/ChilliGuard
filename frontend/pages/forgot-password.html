<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChilliGuard · Forgot Password</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/forgot-password.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/font-awesome.min.css">
</head>
<body>
    <div class="forgot-wrapper">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-lg-5 col-md-7 col-11">
                    <div class="card forgot-card shadow-lg border-0">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <h1 class="brand-name">
                                    <i class="fas fa-leaf text-success me-2"></i>ChilliGuard
                                </h1>
                                <p class="brand-tagline">Reset Your Password</p>
                            </div>
                            <h4 class="fw-bold text-center mb-1">Forgot Password?</h4>
                            <p class="text-muted text-center mb-4">
                                Enter your registered email address and we will send you a link to reset your password.
                            </p>
                            <form id="forgotForm" novalidate>
                                <div class="mb-3">
                                    <label for="resetEmail" class="form-label fw-semibold">
                                        <i class="far fa-envelope me-1"></i> Email
                                    </label>
                                    <input type="email" class="form-control form-control-lg" id="resetEmail"
                                    placeholder="Enter your email" required />
                                </div>
                                <button type="submit" class="btn btn-success w-100 btn-lg fw-semibold">
                                    <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                                </button>
                            </form>
                            <hr class="my-4" />
                            <p class="text-center mb-0">
                                <a href="login.html" class="text-success fw-semibold text-decoration-none back-to-login">
                                    <i class="fas fa-arrow-left me-1"></i> Back to Login
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/forgot-password.js"></script>
</body>
</html>
